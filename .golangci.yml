# golangci-lint configuration for GolangExercise
# This makes the linter more lenient for learning/example code

run:
  # Timeout for analysis
  timeout: 5m
  
  # Skip directories
  skip-dirs:
    - vendor

  # Skip files
  skip-files: []

linters:
  disable-all: true
  enable:
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code suggestions
    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Advanced Go linter
    - unused        # Check for unused code

linters-settings:
  errcheck:
    # Allow unchecked errors in example files
    exclude-functions:
      - fmt.Print.*
      - fmt.Fprint.*

issues:
  # Maximum issues count per one linter
  max-issues-per-linter: 0
  
  # Maximum count of issues with the same text
  max-same-issues: 0
  
  # Exclude certain warnings for example/learning code
  exclude-rules:
    # Exclude all issues in examples directory
    - path: examples/
      linters:
        - errcheck
        - gosec
        - gocritic
    
    # Exclude all issues in go-workspace (learning space)
    - path: go-workspace/
      linters:
        - errcheck
        - gosec
        - gocritic
    
    # Allow unused variables in example code
    - path: examples/
      text: "is unused"
    
    # Allow unused variables in workspace
    - path: go-workspace/
      text: "is unused"

