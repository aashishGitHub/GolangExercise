name: ticketing-ci

# Scoped to ticket-booking/ so this doesn't run for unrelated changes
# elsewhere in this monorepo. Test + build only — no `terraform apply`, no
# Lambda/S3/CloudFront deploy step. Mirrors fieldsync-ci.yml's structure.
# The `web` and lambda-cross-compile jobs are added once those phases land
# (see ticket-booking/MILESTONES.md) — Phase 0 only has a Go module and a
# terraform skeleton.
on:
  push:
    paths: ["ticket-booking/**"]
  pull_request:
    paths: ["ticket-booking/**"]

defaults:
  run:
    working-directory: ticket-booking

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ticket-booking/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      # No AWS credentials configured — this only checks the HCL itself
      # parses/type-checks. Never `plan` or `apply`.
      - working-directory: ticket-booking/infra/terraform/envs/local
        run: |
          terraform init -backend=false
          terraform validate
